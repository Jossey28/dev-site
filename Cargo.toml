[package]
name = "dev-site"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"

[dependencies]
# Core Leptos (no global ssr/hydrate features here)
leptos = { version = "0.8.19" }
leptos_meta = { version = "0.8.6" }
leptos_router = { version = "0.8.13" }
leptos-use = { version = "0.18.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

# Server-only dependencies (optional)
leptos_axum = { version = "0.8.9", optional = true }
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tower-livereload = { version = "0.10.3", optional = true }

# Client/WASM-only dependencies (optional)
wasm-bindgen = { version = "0.2.121", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
default = ["ssr"]

hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:rusqlite",
    "dep:tower-livereload",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "dev-site"
site-root = "target/site"
site-pkg-dir = "pkg"

style-file = "style/main.scss"
assets-dir = "public"

site-addr = "127.0.0.1:8080"
reload-port = 8081

browserquery = "defaults"

bin-package = "dev-site"
bin-features = ["ssr"]
bin-default-features = false

lib-package = "dev-site"
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
